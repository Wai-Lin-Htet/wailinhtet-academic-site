  <style>
    /* Base styling for the Apple-like feel */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7; /* Subtle light gray background */
      padding: 40px;
      margin: 0;
    }

    /* Sidebar Container */
    .sidebar {
      width: 280px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 24px 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    /* Category Header */
    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 12px 12px;
    }

    /* List Reset */
    .nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-list li {
      margin-bottom: 2px;
    }

    /* Link Styling */
    .nav-list a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #475569;
      font-size: 0.95rem;
      padding: 10px 12px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Hover State */
    .nav-list a:hover {
      background-color: #f8fafc;
      color: #1e293b;
    }

    /* Active State (All Courses) */
    .nav-list a.active {
      background-color: #f0f4ff; /* Light blue background */
      color: #1e3a8a; /* Deep blue text */
      font-weight: 600;
    }

    /* Chevron Icon */
    .chevron {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.7;
    }
    
    .nav-list a.active .chevron {
      opacity: 1; /* Fully opaque when active */
    }
  </style>
</head>
